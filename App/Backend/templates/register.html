{% extends "base.html" %}

{% block title %}Sign Up - LedgerOne{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <article>
        <header>
            <h2 style="margin-bottom: 0.25rem;">Create Account</h2>
            <p style="color: var(--pico-muted-color); font-size: 0.9rem;">Join LedgerOne as an Employee</p>
        </header>

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form action="/register" method="POST">
            <label for="username">
                Username
                <input type="text" id="username" name="username" value="{{ username or '' }}" placeholder="Choose a unique username" required autofocus>
            </label>

            <label for="password">
                Password
                <input type="password" id="password" name="password" placeholder="Choose a password" required minlength="4">
            </label>

            <label for="confirm_password">
                Confirm Password
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required minlength="4">
            </label>

            <button type="submit" style="width: 100%; margin-top: 1rem;">Register</button>
        </form>

        <footer style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem;">
            Already have an account? <a href="/login">Sign in here</a>
        </footer>
    </article>
</div>
{% endblock %}
