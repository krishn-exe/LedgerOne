services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    command: ["sh", "-c", "python ../Database/setup.py && python ../Database/populate.py && exec uvicorn main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8001:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
